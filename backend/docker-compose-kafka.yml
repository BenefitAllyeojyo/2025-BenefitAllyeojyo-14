# 로컬 개발용 Kafka (단일 브로커, KRaft 모드 — ZooKeeper 불필요)
# Outbox → Kafka 승격 파이프라인의 fast-path/safety-net 발행 대상.
#
# 사용법:
#   docker compose -f docker-compose-kafka.yml up -d
#   docker compose -f docker-compose-kafka.yml down            # 종료
#   docker compose -f docker-compose-kafka.yml down -v         # 볼륨까지 삭제
#
# 애플리케이션 설정: spring.kafka.bootstrap-servers: localhost:9092
# 토픽은 아래 kafka-init 컨테이너가 생성한다(자동 생성에 의존하지 않음).

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: heyoung-kafka
    ports:
      - "9092:9092"     # 호스트(애플리케이션)용 리스너
    environment:
      # --- KRaft 단일 노드(broker+controller 겸임) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- 리스너: 컨테이너 내부(29092) / 호스트(9092) 분리 ---
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # --- 단일 브로커이므로 복제/ISR = 1 ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 파이프라인 토픽을 명시적으로 생성(OutboxType별 1토픽, 파티션 3, RF 1)
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: heyoung-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic command.corebank.transaction-completed.v1 --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic command.corebank.payment-method-linked.v1 --partitions 3 --replication-factor 1 &&
      echo '=== topics created ===' &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
      "

  # (선택) 브라우저에서 토픽/메시지 확인용 UI — http://localhost:8090
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: heyoung-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: heyoung-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
