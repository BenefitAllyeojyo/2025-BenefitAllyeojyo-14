# =============================================================================
# Outbox → Kafka 승격: 프로듀서 설정 예시
# -----------------------------------------------------------------------------
# 실제 application.yml 은 jasypt 암호화 + .gitignore 대상이라 저장소에 없다.
# 이 파일은 승격에 필요한 키를 문서화한 예시이며, 실제 값은 application.yml 에 채운다.
#
# 전송 경로는 두 갈래다.
#   ① Fast-path   : 커밋 직후(AFTER_COMMIT) Kafka 즉시 발행 → 지연 ≈ 0 (best-effort).
#   ② Safety-net  : 저주기 폴링. sent_at IS NULL 인 미전송분만 재발행.
#                   fast-path 가 놓친 건(브로커 다운/커밋 후 크래시/콜백 유실)을 사후 복구.
# 두 경로는 같은 토픽/발행 로직을 공유하고, 중복은 소비자 멱등(outbox_id UNIQUE)으로 무해화된다.
# =============================================================================

spring:
  kafka:
    # [BOUND] KafkaProducerConfig 가 이 값을 @Value 로 주입한다(기본 localhost:9092).
    bootstrap-servers: localhost:9092
    producer:
      # ⚠️ [코드 고정 — 이 yml 에서 바인딩되지 않음]
      # 아래 acks / enable.idempotence 는 KafkaProducerConfig 에서 하드코딩된다
      # (ProducerConfig.ACKS_CONFIG="all", ENABLE_IDEMPOTENCE_CONFIG=true).
      # Spring Boot 의 spring.kafka.* 자동 바인딩을 쓰지 않고 직접 ProducerFactory 를 구성하므로,
      # 여기 값을 바꿔도 실제 프로듀서에는 반영되지 않는다(문서화 목적으로만 남겨둔다).
      # 값을 실제로 바꾸려면 KafkaProducerConfig 를 수정해야 한다.
      acks: all
      properties:
        enable.idempotence: true

outbox:
  dispatch:
    # 안전망(폴링) 주기. 5000 → 30000 으로 상향.
    # fast-path 가 정상 경로 지연을 제거하므로 폴링은 안전망 역할만 하며 지연에 둔감하다.
    delay-ms: 30000
    initial-delay-ms: 5000
