# Kafka 소비자 설정 예시 (community 모듈)
#
# 실제 application.yml 은 .gitignore 로 저장소에 커밋되지 않으므로,
# Outbox → Kafka 승격에 필요한 Kafka 소비자 설정을 이 예시 파일로 문서화한다.
# 아래 내용을 실제 application.yml 의 `spring:` 하위에 병합해 사용한다.
#
# 참고: KafkaConsumerConfig 는 각 프로퍼티에 @Value 기본값을 두어
# (bootstrap-servers=localhost:9092, group-id=community-recommendation,
#  auto-offset-reset=earliest) 프로퍼티가 없어도 로컬에서 동작한다.
spring:
  kafka:
    # [BOUND] Kafka 브로커 주소 — KafkaConsumerConfig 가 @Value 로 주입(기본 localhost:9092).
    bootstrap-servers: localhost:9092
    consumer:
      # [BOUND] 컨슈머 그룹 ID — @Value 주입(기본 community-recommendation).
      # 같은 그룹의 인스턴스들이 파티션을 나눠 소비한다.
      group-id: community-recommendation
      # [BOUND] auto-offset-reset — @Value 주입(기본 earliest).
      # 저장된 오프셋이 없을 때 가장 앞(earliest)부터 소비하여 유실을 방지한다.
      auto-offset-reset: earliest
      # ⚠️ [코드 고정 — 이 yml 에서 바인딩되지 않음]
      # enable-auto-commit 은 KafkaConsumerConfig 에서 하드코딩된다
      # (ConsumerConfig.ENABLE_AUTO_COMMIT_CONFIG=false). 직접 ConsumerFactory 를 구성하므로
      # 여기 값을 바꿔도 실제 컨슈머에는 반영되지 않는다(문서화 목적으로만 남겨둔다).
      # 처리 성공 후에만 커밋되도록 하여 at-least-once 를 보장하며,
      # 중복은 event_consume_log.outbox_id UNIQUE 로 멱등 처리되어 무해하다.
      enable-auto-commit: false
